<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#173F32">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- =================== SHARE PREVIEW (edit these 4 lines) ===================
     WhatsApp / Facebook read only this part, so update it together with config.js -->
<title>Engagement Invitation</title>
<meta name="description" content="Join us in celebrating the engagement of Vishnu &amp; Aiswarya on Wednesday, 23rd December 2026 at Maruthi Hall, Swagath Kalyana Mandapam.">
<meta property="og:title" content="Vishnu &amp; Aiswarya | Engagement Invitation">
<meta property="og:image" content="assets/images/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="622">
<meta name="twitter:image" content="assets/images/og-image.jpg">
<link rel="artifact-thumbnail" href="assets/images/og-image.jpg">
<!-- ========================================================================= -->

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23173F32'/%3E%3Cpath d='M32 14c-1.5 4-5 6-5 11 0 3 2.2 5 5 5s5-2 5-5c0-5-3.5-7-5-11z' fill='%23B58A3A'/%3E%3Cpath d='M18 40c0-4 6-7 14-7s14 3 14 7-6 5-14 5-14-1-14-5z' fill='none' stroke='%23B58A3A' stroke-width='2'/%3E%3Cline x1='32' y1='42' y2='50' x2='32' stroke='%23B58A3A' stroke-width='2'/%3E%3Cline x1='20' y1='50' x2='44' y2='50' stroke='%23B58A3A' stroke-width='2'/%3E%3C/svg%3E">

<link rel="preload" as="image" href="assets/images/video-first-frame.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600;700&family=Petit+Formal+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body class="intro-active">

<canvas id="particles" aria-hidden="true"></canvas>
<div id="cursor-dot" aria-hidden="true"></div>
<div id="scroll-progress" aria-hidden="true"></div>

<!-- ======================= 1–3. OPENING SCREEN ======================= -->
<div id="opening">
  <video id="opening-video" muted playsinline webkit-playsinline preload="none"></video>
  <div class="opening-fade-veil"></div>

  <div class="opening-cover" id="opening-cover">
    <div class="opening-cover-content">
      <div class="opening-mark" data-bind="text.openingWelcome"></div>
      <div class="opening-sub" data-bind="text.openingSub"></div>
      <div class="opening-names"><span data-name="groom"></span><em>&amp;</em><span data-name="bride"></span></div>
      <div class="opening-date" data-bind="shortDate"></div>
      <div class="open-invitation-wrap">
        <span class="btn-halo" aria-hidden="true"></span>
        <button class="open-invitation-btn" id="open-invitation-btn" type="button">
          <span class="btn-flourish" aria-hidden="true"></span>
          <span class="flame-dot" aria-hidden="true"></span>
          <span class="btn-label" data-bind="text.openButton"></span>
          <span class="btn-flourish btn-flourish--right" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>

  <button class="skip-intro" id="skip-intro" type="button" aria-label="Skip introduction video" data-bind="text.skipButton"></button>
</div>

<main id="main">

  <!-- ======================= 4. GANESHA / HERO ======================= -->
  <section id="hero" class="section bg-a bg-a-hero">
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-ivory" aria-hidden="true"></div>
    <div class="section-inner">
      <img class="ganesha-icon reveal" id="ganesha-img" alt="Lord Ganesha" width="50" height="50" loading="eager">
      <div class="hero-mark reveal" data-bind="text.blessing"></div>

      <svg class="lamp-svg reveal" width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
        <path class="lamp-flame" d="M32 12c-2 4.5-6 7-6 12.5 0 3.6 2.7 6 6 6s6-2.4 6-6c0-5.5-4-8-6-12.5z" fill="none" stroke="#B58A3A" stroke-width="1.6"/>
        <path d="M16 42c0-5 7-8.5 16-8.5s16 3.5 16 8.5-7 6-16 6-16-1-16-6z" fill="none" stroke="#B58A3A" stroke-width="1.4"/>
        <line x1="32" y1="45" x2="32" y2="55" stroke="#B58A3A" stroke-width="1.4"/>
        <line x1="19" y1="55" x2="45" y2="55" stroke="#B58A3A" stroke-width="1.4"/>
      </svg>

      <div class="hero-eyebrow reveal" data-bind="text.heroEyebrow"></div>
      <h1 class="hero-names reveal-scale"><span data-name="groom"></span> <span class="hero-amp">&amp;</span> <span data-name="bride"></span></h1>

      <div class="ornament-divider reveal"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>

      <div class="hero-sub reveal" data-bind="text.heroSub"></div>
      <div class="hero-date reveal" data-bind="shortDate"></div>
    </div>

    <div class="scroll-cue">
      <span data-bind="text.scrollCue"></span>
      <span class="stem"></span>
    </div>
  </section>

  <!-- (optional) COUPLE — off in the reference; enable in config.js -->
  <section id="couple" class="section bg-a bg-a-couple" hidden>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-ivory" aria-hidden="true"></div>
    <div class="section-inner">
      <div class="eyebrow reveal" data-bind="coupleEyebrow"></div>
      <p class="together reveal" data-bind="text.heroEyebrow"></p>
      <div class="couple-names reveal-scale"><span data-name="groom"></span> <span class="couple-and">&amp;</span> <span data-name="bride"></span></div>
      <div class="ornament-divider reveal"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
    </div>
  </section>

  <!-- ======================= 5–7. CEREMONY + COUNTDOWN ======================= -->
  <section id="ceremony" class="section bg-b bg-b-ceremony">
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-cream" aria-hidden="true"></div>
    <div class="section-inner">
      <div class="eyebrow reveal" data-bind="text.ceremonyEyebrow"></div>
      <h2 class="section-title reveal" data-bind="text.ceremonyTitle"></h2>

      <div class="event-card reveal" style="margin-top:26px;">
        <div class="event-day" data-bind="weddingDay"></div>
        <div class="event-time"><small data-bind="text.muhurtamLabel"></small><span data-bind="muhurtam"></span></div>

        <div class="venue-label" data-bind="text.venueLabel"></div>
        <div class="venue-name" data-bind="venueName"></div>
        <div class="venue-place" data-bind="venueAddress"></div>

        <a class="btn" data-href="mapsUrl" target="_blank" rel="noopener" data-bind="text.viewLocation"></a>
      </div>

      <div class="countdown reveal" id="countdown-wedding" aria-label="Countdown to the engagement ceremony">
        <div class="unit"><div class="flip-card"><span class="num" data-d>00</span></div><span class="lbl">Days</span></div>
        <span class="sep" aria-hidden="true"></span>
        <div class="unit"><div class="flip-card"><span class="num" data-h>00</span></div><span class="lbl">Hrs</span></div>
        <span class="sep" aria-hidden="true"></span>
        <div class="unit"><div class="flip-card"><span class="num" data-m>00</span></div><span class="lbl">Min</span></div>
        <span class="sep" aria-hidden="true"></span>
        <div class="unit"><div class="flip-card"><span class="num" data-s>00</span></div><span class="lbl">Sec</span></div>
      </div>
    </div>
  </section>

  <!-- (optional) MESSAGE — off in the reference; enable in config.js -->
  <section id="message" class="section bg-b bg-b-message" hidden>
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-cream" aria-hidden="true"></div>
    <div class="section-inner reveal-scale">
      <svg class="lamp-svg" width="32" height="32" viewBox="0 0 64 64" aria-hidden="true" style="margin-bottom:14px;">
        <path class="lamp-flame" d="M32 12c-2 4.5-6 7-6 12.5 0 3.6 2.7 6 6 6s6-2.4 6-6c0-5.5-4-8-6-12.5z" fill="none" stroke="#B58A3A" stroke-width="1.6"/>
      </svg>
      <p class="message-text" data-bind="messageText"></p>
      <div class="ornament-divider"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
    </div>
  </section>

  <!-- ======================= 8. VENUE / GOOGLE MAPS ======================= -->
  <section id="locations" class="section bg-b bg-b-locations">
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-cream" aria-hidden="true"></div>
    <div class="section-inner">
      <div class="eyebrow reveal" data-bind="text.venueEyebrow"></div>
      <h2 class="section-title reveal" data-bind="text.venueTitle"></h2>
      <div class="ornament-divider reveal"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>

      <div class="locations-grid">
        <a class="location-card reveal" data-href="mapsUrl" target="_blank" rel="noopener">
          <svg class="location-pin" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 22s7-7.58 7-13A7 7 0 1 0 5 9c0 5.42 7 13 7 13z" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="12" cy="9" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span class="location-name" data-bind="venueName"></span>
          <span class="location-cta"><span data-bind="text.viewLocation"></span> <span class="arrow">&rarr;</span></span>
        </a>
      </div>
    </div>
  </section>

  <!-- ======================= 9–10. FAMILIES ======================= -->
  <section id="family" class="section bg-a bg-a-family">
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-ivory" aria-hidden="true"></div>
    <div class="section-inner">
      <div class="eyebrow reveal" data-bind="text.familyEyebrow"></div>
      <h2 class="section-title reveal" data-bind="text.familyTitle"></h2>

      <div class="family-grid">
        <div class="family-block reveal">
          <div class="who" data-bind="text.groomFamilyLabel"></div>
          <div class="parents"><span data-bind="groomFamily.father"></span><br>&amp; <span data-bind="groomFamily.mother"></span></div>
          <div class="place" data-bind="groomFamily.address"></div>
          <div class="family-divider" style="margin-top:20px;"></div>
        </div>
        <div class="family-block reveal">
          <div class="who" data-bind="text.brideFamilyLabel"></div>
          <div class="parents"><span data-bind="brideFamily.father"></span><br>&amp; <span data-bind="brideFamily.mother"></span></div>
          <div class="place" data-bind="brideFamily.address"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ======================= 11. GALLERY ======================= -->
  <section id="gallery" class="section bg-gallery">
    <div class="section-inner">
      <div class="eyebrow reveal" data-bind="text.galleryEyebrow"></div>
      <h2 class="section-title reveal" data-bind="text.galleryTitle"></h2>
      <div class="ornament-divider reveal"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
      <p class="gallery-lede reveal" data-bind="text.galleryLede"></p>

      <div class="photo-wall-stage">
        <div class="photo-wall__fx" aria-hidden="true">
          <span class="photo-decor photo-decor--spark a"></span>
          <span class="photo-decor photo-decor--spark b"></span>
          <span class="photo-decor photo-decor--petal d"></span>
          <span class="photo-decor photo-decor--dot f"></span>
          <span class="photo-decor photo-decor--dot g"></span>
          <span class="photo-decor photo-decor--ray h"></span>
        </div>
        <!-- photos are inserted here from config.js -->
        <div class="photo-wall" id="photoWall" aria-label="Engagement photographs"></div>
      </div>
    </div>
  </section>

  <!-- ======================= 12. CLOSING ======================= -->
  <footer id="closing" class="section bg-f bg-f-closing">
    <div class="bg-layer" aria-hidden="true"></div>
    <div class="overlay overlay-dark" aria-hidden="true"></div>
    <div class="section-inner">
      <svg class="lamp-svg reveal" width="40" height="40" viewBox="0 0 64 64" aria-hidden="true">
        <path class="lamp-flame" d="M32 12c-2 4.5-6 7-6 12.5 0 3.6 2.7 6 6 6s6-2.4 6-6c0-5.5-4-8-6-12.5z" fill="none" stroke="#C9A360" stroke-width="1.6"/>
        <path d="M16 42c0-5 7-8.5 16-8.5s16 3.5 16 8.5-7 6-16 6-16-1-16-6z" fill="none" stroke="#C9A360" stroke-width="1.4"/>
        <line x1="32" y1="45" x2="32" y2="55" stroke="#C9A360" stroke-width="1.4"/>
        <line x1="19" y1="55" x2="45" y2="55" stroke="#C9A360" stroke-width="1.4"/>
      </svg>
      <p class="closing-msg reveal" style="margin-top:18px;" data-bind="text.closingMessage"></p>

      <div class="closing-names reveal-scale"><span data-name="groom"></span> <span class="closing-amp">&amp;</span> <span data-name="bride"></span></div>
      <div class="closing-date reveal" data-bind="closingDate"></div>

      <div class="closing-final" id="closing-credit"></div>
    </div>
  </footer>

</main>

<!-- Background music + floating controls -->
<audio id="bg-music" loop preload="none"></audio>
<button id="music-toggle" class="music-toggle is-hidden" type="button" aria-label="Toggle music" aria-pressed="true">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path class="note-bar" d="M9 18V5.5l10-2v12.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="note-head" cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <circle class="note-head" cx="16.5" cy="15.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
  </svg>
</button>

<button id="back-to-top" type="button" aria-label="Back to top">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
    <path d="M12 19V5M12 5l-6 6M12 5l6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div id="gallery-lightbox" aria-hidden="true">
  <button id="gallery-lightbox-close" type="button" aria-label="Close image">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <img id="gallery-lightbox-img" alt="">
</div>

</body>
</html>
